apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Cosign-Signed Images
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Blocks admission of any Pod whose container images are not signed with
      the Cosign key managed in HashiCorp Vault's Transit engine (key name
      "cosign-key"). Pairs with the "Sign Image (Cosign via Vault Transit)"
      Jenkins stage, which signs every image pushed to omarchouchane/ultimate-cicd
      without the private key material ever leaving Vault.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "omarchouchane/ultimate-cicd:*"
          attestors:
            - count: 1
              entries:
                - keys:
                    kms: "hashivault://cosign-key"
